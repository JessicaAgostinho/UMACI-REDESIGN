<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Contacto — Universidade da Madeira - Coleção de Insetos"/>
    <meta name="author" content="Jéssica Cabral Agostinho"/>
    <title>Contacto — UMACI</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="hero" style="min-height: 50vh;">
        <div class="hero__parallax">
            <img src="./assets/images/Borboleta-monarca.jpg" alt="Contacto UMACI" style="filter: brightness(0.6);" />
        </div>
        <div class="hero__glass">
            <span class="hero__kicker">Estamos aqui para ajudar</span>
            <h1>Fala <em>connosco</em></h1>
            <p>Questões sobre a coleção, visitas guiadas ou colaboração científica?</p>
        </div>
    </section>

    <main>
        <section class="sobre">
            <div class="container">
                <div class="sobre__grid" style="align-items: start;">
                    
                    <div class="contacto__form-container" style="background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);">
                        <span class="section-tag">Envie uma mensagem</span>
                        <h2 style="margin-bottom: 30px;">Formulário de <em>Contacto</em></h2>
                        
                        <form action="#" class="contacto__form">
                            <div style="margin-bottom: 20px;">
                                <label style="display:block; color: white; margin-bottom: 8px; font-size: 0.9rem;">Nome</label>
                                <input type="text" placeholder="O seu nome completo" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;" required>
                            </div>
                            <div style="margin-bottom: 20px;">
                                <label style="display:block; color: white; margin-bottom: 8px; font-size: 0.9rem;">E-mail</label>
                                <input type="email" placeholder="seuemail@exemplo.com" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;" required>
                            </div>
                            <div style="margin-bottom: 20px;">
                                <label style="display:block; color: white; margin-bottom: 8px; font-size: 0.9rem;">Mensagem</label>
                                <textarea rows="5" placeholder="Como podemos ajudar?" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;" required></textarea>
                            </div>
                            <button type="submit" class="btn btn--primary" style="width: 100%;">Enviar Mensagem</button>
                        </form>
                    </div>

                    <div class="contacto__info-sidebar">
                        <div class="num-card" style="margin-bottom: 20px; text-align: left; padding: 25px;">
                            <h3 style="color: #a8d8b4; margin-bottom: 15px;">Localização</h3>
                            <p style="font-size: 0.95rem;">
                                📍 <strong>Campus da Penteada</strong><br>
                                Universidade da Madeira<br>
                                9020-105 Funchal, Madeira
                            </p>
                        </div>

                        <div class="num-card" style="margin-bottom: 20px; text-align: left; padding: 25px;">
                            <h3 style="color: #a8d8b4; margin-bottom: 15px;">Email e Telefone</h3>
                            <p style="font-size: 0.95rem;">
                                ✉️ <a href="mailto:umaci@uma.pt" style="color: white; text-decoration: none;">umaci@uma.pt</a><br>
                                📞 +351 291 705 000
                            </p>
                        </div>

                        <div style="border-radius: 15px; overflow: hidden; height: 250px; border: 1px solid rgba(255,255,255,0.1);">
                            <iframe 
                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m13!1m11!1m3!1d3350.5638167735316!2d-16.92723062369792!3d32.65839019058988!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xc60601337e72153%3A0xe4d3a6828a2b5314!2sUniversidade%20da%20Madeira!5e0!3m2!1spt-PT!2spt!4v1700000000000!5m2!1spt-PT!2spt" 
                                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                            </iframe>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="./js/scripts.js"></script>
</body>
</html>
